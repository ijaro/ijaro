<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-mesh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Border with Gradient Glow -->
  <rect width="898" height="218" x="1" y="1" rx="15" fill="none" stroke="url(#text-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decorative Pipeline Wave / Glowing Mesh -->
  <path d="M 0 160 Q 225 120 450 170 T 900 130 L 900 220 L 0 220 Z" fill="url(#glow-mesh)" opacity="0.6"/>
  <path d="M 0 180 Q 250 140 500 190 T 900 160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M 0 195 Q 200 160 450 200 T 900 175" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Pipeline Nodes (Circles representing distributed streaming checkpoints) -->
  <circle cx="150" cy="170" r="4" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="320" cy="145" r="5" fill="#818cf8" filter="url(#neon-glow)"/>
  <circle cx="500" cy="190" r="4" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="700" cy="165" r="5" fill="#c084fc" filter="url(#neon-glow)"/>
  <circle cx="850" cy="140" r="4" fill="#38bdf8" filter="url(#neon-glow)"/>

  <!-- Top Status Badge -->
  <g transform="translate(330, 24)">
    <rect width="240" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      ENTERPRISE LAKEHOUSE &amp; CDC
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="98" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="3" filter="url(#neon-glow)">
    SHAWN IJAZ
  </text>

  <!-- Subtitle -->
  <text x="450" y="132" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="2">
    SENIOR DATA ENGINEER &amp; LAKEHOUSE ARCHITECT
  </text>

  <!-- Bottom Core Capability Pills -->
  <text x="450" y="165" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1.2">
    Snowflake • Databricks • Apache Spark • Airflow • dbt Core • ClickHouse • Kafka • RAG
  </text>
</svg>
